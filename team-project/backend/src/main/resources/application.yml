spring:
  application:
    name: chat-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/chatbot}
    username: ${SPRING_DATASOURCE_USERNAME:gdgoc}
    password: ${SPRING_DATASOURCE_PASSWORD:gdgoc-dev-password}
  sql:
    init:
      mode: never
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:gdgoc}
    password: ${RABBITMQ_PASSWORD:gdgoc-dev-password}
    template:
      retry:
        enabled: true
        max-attempts: 3
        initial-interval: 1s
  threads:
    virtual:
      enabled: true
server:
  port: 8080
management:
  health:
    rabbit:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health
app:
  memory:
    exchange: memory
    queue: memory.add.requested.v1
    routing-key: memory.add.requested
