services:
  # 우리가 만든 채팅 앱
  app:
    build: .                # 현재 디렉터리의 Dockerfile로 빌드
    ports:
      - "8000:8000"         # 호스트:컨테이너 — 브라우저에서 localhost:8000
    depends_on:
      - redis               # redis를 먼저 띄움

  redis:
    image: redis:7          # 빌드 없이 이미지 그대로 사용
# docker compose는 하나의 네트워크 내에 컨테이너들을 띄우기 때문에, 별다른 네트워크 설정 필요 x
